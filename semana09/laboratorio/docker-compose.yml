# Semana 9 — servicio de juegos con mensajes estructurados y codec intercambiable.
# La variable CODEC (json | bin) la usan servidor, api1, api2 y cliente.
#
#   docker compose up -d --build                       (todo, en json)
#   docker compose up -d --build servidor cliente      (solo el nivel TCP)
#   docker compose exec cliente python cliente.py ANOTAR felipe 15
#   CODEC=bin docker compose up -d --force-recreate servidor cliente api1 api2
#   PowerShell:  $env:CODEC="bin"; docker compose up -d --force-recreate servidor cliente api1 api2
#
#   cliente -> servidor (TCP, codec json|bin)
#   navegador/cliente_http -> nginx (80) -> api1, api2 (8000) -> servidor (5000, codec json|bin)
services:
  servidor:
    build: .
    container_name: sd_servidor
    command: python servidor.py
    environment:
      CODEC: ${CODEC:-json}
      SERVIDOR_PUERTO: "5000"
      TIMEOUT_SERVIDOR: "30"
    networks:
      - sd_net

  api1:
    build: .
    container_name: sd_api1
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    environment:
      CODEC: ${CODEC:-json}
      REPLICA: api1
      SERVIDOR_HOST: servidor
      SERVIDOR_PUERTO: "5000"
    networks:
      - sd_net
    depends_on:
      - servidor

  api2:
    build: .
    container_name: sd_api2
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    environment:
      CODEC: ${CODEC:-json}
      REPLICA: api2
      SERVIDOR_HOST: servidor
      SERVIDOR_PUERTO: "5000"
    networks:
      - sd_net
    depends_on:
      - servidor

  nginx:
    image: nginx:1.27-alpine
    container_name: sd_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    networks:
      - sd_net
    depends_on:
      - api1
      - api2

  cliente:
    build: .
    container_name: sd_cliente
    command: sleep infinity
    stdin_open: true
    tty: true
    environment:
      CODEC: ${CODEC:-json}
      API_URL: http://nginx
      SERVIDOR_HOST: servidor
      SERVIDOR_PUERTO: "5000"
      TIMEOUT_CLIENTE: "5"
    networks:
      - sd_net
    depends_on:
      - servidor

networks:
  sd_net:
    name: sd_net
